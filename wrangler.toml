# Cloudflare Workers static-assets deploy.
# Dashboard "Workers Builds": Build command `npm run build` produces ./dist,
# then "Deploy command" `npx wrangler deploy` serves ./dist as static assets.
name = "diy-calculators"
compatibility_date = "2026-06-08"

[assets]
directory = "./dist"
# directory-format build emits /en/index.html etc; auto-trailing-slash handles routing.
html_handling = "auto-trailing-slash"
not_found_handling = "none"
